<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Type Converter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0f3460; border-bottom: 1px solid #1a1a2e;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <img src="icons/icon32.png" alt="PixelMorph" width="24" height="24" style="border-radius: 6px;" />
      <h1 style="margin: 0; font-size: 15px; font-weight: 600; color: #e0e0e0; letter-spacing: 0.3px;">PixelMorph</h1>
    </div>
    <button id="theme-toggle" class="btn btn-icon" title="Toggle Theme" style="background: transparent; border: none; font-size: 16px; cursor: pointer;">
      🌙
    </button>
  </header>
  <nav class="tab-bar" role="tablist" aria-label="Converter tabs">
    <button
      class="tab-btn active"
      role="tab"
      data-tab="standard"
      aria-selected="true"
      aria-controls="standard-view"
      id="tab-standard"
    >
      Standard Converter
    </button>
    <button
      class="tab-btn"
      role="tab"
      data-tab="gif"
      aria-selected="false"
      aria-controls="gif-view"
      id="tab-gif"
    >
      Advanced GIF Creator
    </button>
  </nav>

  <main>
    <section id="standard-view" role="tabpanel" aria-labelledby="tab-standard">
      <!-- Standard Converter UI is rendered by standard-converter.js -->
    </section>

    <section id="gif-view" role="tabpanel" aria-labelledby="tab-gif" hidden>
      <!-- GIF Creator UI is rendered by gif-creator.js -->
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
